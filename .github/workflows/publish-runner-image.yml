name: Publish runner image
on:
  push:
    branches: [main]
    paths: [build/linux-builder.Dockerfile]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/linux-builder.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/linux-builder:latest
