name: Release
on:
  push:
    tags: [v*]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # ponytail: third-party action; if compromised or deprecated, replace with raw actions/cache keyed on Cargo.lock hash
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils
        # ponytail: slow (~15s) but required; GitHub runner images can have stale apt indexes
      - run: npm ci && npm run build
        working-directory: desktop
      - run: cargo build -p knowledge-cli --release
      - run: npx tauri build
        working-directory: desktop
      - run: cp target/release/kos kos-linux-x86_64
      - run: sha256sum kos-linux-x86_64 > kos-linux-x86_64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            kos-*
            target/release/bundle/

  build-other:
    strategy:
      matrix:
        include:
          - os: macos-13
            target: macos-x86_64
            ext: ''
          - os: macos-latest
            target: macos-aarch64
            ext: ''
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            ext: ''
          - os: windows-latest
            target: windows-x86_64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # ponytail: third-party action; if compromised or deprecated, replace with raw actions/cache keyed on Cargo.lock hash
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils && { which xdg-open >/dev/null 2>&1 && sudo ln -sf "$(which xdg-open)" /usr/bin/xdg-open || true; }
      - run: npm ci && npm run build
        working-directory: desktop
      - run: cargo build -p knowledge-cli --release
      - run: npx tauri build
        working-directory: desktop
      - run: cp target/release/kos${{ matrix.ext }} kos-${{ matrix.target }}${{ matrix.ext }}
      - if: runner.os != 'Windows'
        run: sha256sum kos-${{ matrix.target }} > kos-${{ matrix.target }}.sha256
      - if: runner.os == 'Windows'
        shell: bash
        run: sha256sum kos-${{ matrix.target }}.exe > kos-${{ matrix.target }}.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            kos-*
            target/release/bundle/

  release:
    needs: [build-linux, build-other]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts

      - run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          awk "/^## \\[$v\\]/{p=1; next} /^## \\[/{p=0} p" CHANGELOG.md > artifacts/notes.md

      - env:
          GH_TOKEN: ${{ github.token }}
        working-directory: artifacts
        run: |
          gh release delete "$GITHUB_REF_NAME" -y 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            kos-linux-x86_64 kos-linux-aarch64 kos-macos-x86_64 kos-macos-aarch64 kos-windows-x86_64.exe *.sha256
          # ponytail: bundle formats may not exist depending on platform/tooling
          if [ -d target/release/bundle ]; then
            find target/release/bundle -type f -exec \
              gh release upload "$GITHUB_REF_NAME" {} \;
          fi
