[tools]
rust = "stable"
node = "26"

# ── Aggregate ──────────────────────────────────────────────

[tasks.build]
description = "Build everything (Rust + mobile)"
depends = ["build-rust", "build-mobile"]

[tasks.build-rust]
description = "Build all Rust crates"
run = "cargo build"

[tasks.test]
description = "Run all Rust tests"
run = "cargo test"

[tasks.test-bdd]
description = "Run BDD cucumber tests for the kos CLI"
run = "cargo test --test cucumber -p knowledge-cli"

[tasks.test-features]
description = "Run all CLI feature tests"
run = "FEATURES_DIR=features cargo test --test cucumber -p knowledge-cli"

[tasks.test-features-prd-0001]
description = "Run PRD-0001 features (entity-management, import, search)"
run = "FEATURES_DIR=features/prd-0001 cargo test --test cucumber -p knowledge-cli"

[tasks.test-features-prd-0002]
description = "Run PRD-0002 features (extended-import, resolution, pdf-import)"
run = "FEATURES_DIR=features/prd-0002 cargo test --test cucumber -p knowledge-cli"

[tasks.test-features-prd-0003]
description = "Run PRD-0003 features (views, plugin, collections, traversal)"
run = "FEATURES_DIR=features/prd-0003 cargo test --test cucumber -p knowledge-cli"

[tasks.lint]
description = "Lint all Rust code (clippy + fmt check)"
run = "cargo clippy -- -D warnings && cargo fmt --check"

[tasks.bench]
description = "Run all benchmarks"
run = "cargo bench --workspace"

[tasks.bench-storage]
description = "Run knowledge-storage benchmarks (traversal)"
run = "cargo bench -p knowledge-storage"

[tasks.bench-derivation]
description = "Run knowledge-derivation benchmarks (views + search)"
run = "cargo bench -p knowledge-derivation"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt"

[tasks.clean]
description = "Clean all build artifacts"
run = ["cargo clean", "rm -rf mobile/node_modules"]

[tasks.api]
description = "Run the API server"
run = "cargo run -p knowledge-api"

[tasks.install]
description = "Install API + desktop binaries and mobile dependencies"
run = [
    "cargo install --path api",
    "cargo install --path desktop/src-tauri",
    { task = "build-mobile" },
]

# ── Rust per-package ───────────────────────────────────────

[tasks.build-core]
description = "Build knowledge-core"
run = "cargo build -p knowledge-core"

[tasks.build-api]
description = "Build knowledge-api"
run = "cargo build -p knowledge-api"

[tasks.build-desktop]
description = "Build knowledge-desktop"
run = "cargo build -p knowledge-desktop"

[tasks.build-desktop-host]
description = "Build the desktop host app to build/"
dir = "desktop"
run = [
    "npm install",
    "npm run build",
    "cargo tauri build --no-bundle",
    "mkdir -p ../build && cp ../target/release/knowledge-desktop ../build/knowledge-desktop",
]

[tasks.build-cli]
description = "Build the kos CLI binary to build/"
run = ["cargo build -p knowledge-cli", "mkdir -p build && cp target/debug/kos build/"]

[tasks.test-core]
description = "Test knowledge-core"
run = "cargo test -p knowledge-core"

[tasks.test-api]
description = "Test knowledge-api"
run = "cargo test -p knowledge-api"

[tasks.lint-core]
description = "Lint knowledge-core"
run = "cargo clippy -p knowledge-core -- -D warnings && cargo fmt --check"

[tasks.lint-api]
description = "Lint knowledge-api"
run = "cargo clippy -p knowledge-api -- -D warnings && cargo fmt --check"

[tasks.fmt-core]
description = "Format knowledge-core"
run = "cargo fmt -p knowledge-core"

[tasks.fmt-api]
description = "Format knowledge-api"
run = "cargo fmt -p knowledge-api"

[tasks.desktop]
description = "Run the desktop app (Tauri dev)"
run = "cargo tauri dev"

[tasks.desktop-serve]
description = "Run the desktop app (Tauri dev)"
run = "bun --cwd=desktop install ; bun --cwd=desktop run dev"

[tasks.desktop-tmux]
description = "Run the desktop app and server in a tmux session (mise desktop and mise desktop-serve)"
run = "tmux new-session -d -s mise 'mise desktop-serve' && tmux split-window -h 'mise desktop' && tmux attach-session -d -t mise"


# ── Mobile ─────────────────────────────────────────────────

[tasks.build-mobile]
description = "Install mobile dependencies"
dir = "mobile"
run = "npm install"

[tasks.mobile-dev]
description = "Start Metro bundler"
dir = "mobile"
run = "npm start"

[tasks.mobile-test]
description = "Run mobile tests (Jest)"
dir = "mobile"
run = "npm test"

[tasks.mobile-lint]
description = "Lint mobile code (ESLint)"
dir = "mobile"
run = "npm run lint"

[tasks.mobile-android]
description = "Run mobile on Android"
dir = "mobile"
run = "npm run android"

[tasks.mobile-ios]
description = "Run mobile on iOS"
dir = "mobile"
run = "npm run ios"

# ── Docs ───────────────────────────────────────────────────

[tasks.docs]
description = "Build & serve docs in Docker (http://localhost:8080)"
run = "docker build -t knowledge-os-docs -f docs/Dockerfile . && docker run --rm -p 8080:3000 knowledge-os-docs"
