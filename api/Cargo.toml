[package]
name = "knowledge-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Knowledge OS REST API"

[dependencies]
knowledge-core = { path = "../core/knowledge-core" }
knowledge-storage = { path = "../core/knowledge-storage" }
knowledge-import = { path = "../core/knowledge-import" }
knowledge-derivation = { path = "../core/knowledge-derivation" }
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
