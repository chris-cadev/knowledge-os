[package]
name = "knowledge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Knowledge OS command-line interface"

[[bin]]
name = "kos"
path = "src/main.rs"

[dependencies]
knowledge-core = { path = "../core/knowledge-core" }
knowledge-storage = { path = "../core/knowledge-storage" }
knowledge-import = { path = "../core/knowledge-import" }
knowledge-derivation = { path = "../core/knowledge-derivation" }
knowledge-plugin = { path = "../core/knowledge-plugin" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
indicatif = "0.17"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[[test]]
name = "cucumber"
harness = false

[dev-dependencies]
assert_cmd = "2"
cucumber = "0.23"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
