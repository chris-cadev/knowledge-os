[package]
name = "knowledge-derivation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Derivation layer — generates search indexes, embeddings, views"

[dependencies]
knowledge-core = { path = "../knowledge-core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
image = "0.25"
tesseract-rs = { version = "0.3", optional = true }

[features]
default = []
build-tesseract = ["tesseract-rs/build-tesseract"]

[[bench]]
name = "views"
harness = false

[[bench]]
name = "search"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
wiremock = "0.6"
httpmock = "0.7"
