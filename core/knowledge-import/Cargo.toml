[package]
name = "knowledge-import"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Import layer — receives information from external formats"

[dependencies]
knowledge-core = { path = "../knowledge-core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
pdf_oxide = "0.3"
pulldown-cmark = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
docx-rs = "0.4"
calamine = "0.30"
zip = "2"
quick-xml = "0.36"
mailparse = "0.15"
csv = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "mysql", "any"] }
notify = "6"
walkdir = "2"
ignore = "0.4"
sha2 = "0.10"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
knowledge-plugin = { path = "../knowledge-plugin" }
