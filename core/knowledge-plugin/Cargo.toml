[package]
name = "knowledge-plugin"
version = "0.1.0"
edition = "2021"

[dependencies]
knowledge-core = { path = "../knowledge-core" }
knowledge-import = { path = "../knowledge-import" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
